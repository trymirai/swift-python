required-version = "==0.16.8"
line-length = 100
# Maintained adapters use Python 3.14-compatible syntax inside CPython 3.16.
target-version = "py314"
include = ["Sources/libcpython/Compatibility/Python/**/*.py"]
extend-exclude = ["Submodules"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
extra-standard-library = ["_swift_python"]

[lint.per-file-ignores]
# PyPA wheels must be mounted before modules that import those libraries.
"**/packaging/__init__.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
